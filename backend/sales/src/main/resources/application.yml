spring:
  application:
    name: sales-service
  datasource:
    url: jdbc:postgresql://localhost:5431/${SALES_DB_NAME:sales_db}
    username: ${SALES_DB_USER:user}
    password: ${SALES_DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Feign Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
