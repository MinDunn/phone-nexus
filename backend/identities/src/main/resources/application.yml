spring:
  application:
    name: identities-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5431/${IDENTITIES_DB_NAME:identities_db}
    username: ${IDENTITIES_DB_USER:user}
    password: ${IDENTITIES_DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

# Security JWT configuration
phonenexus:
  app:
    jwtSecret: ${JWT_SECRET:phoneNexusSecretKeyForSecurityPurposesOnlyDoNotUseInProductionWithoutChangingIt}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:3600000}
    jwtRefreshExpirationMs: ${JWT_REFRESH_EXPIRATION_MS:86400000}
    verificationUrl: ${VERIFICATION_URL:http://localhost:8081/api/auth/verify}

# Swagger UI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
